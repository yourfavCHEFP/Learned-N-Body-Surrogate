[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "Learned-nbody-surrogate"
version = "0.1.0"
description = "A Graph Neural Network surrogate for learning gravitational N-body dynamics."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

authors = [
    { name = "Olumide Oladosu(CHEF_P)" }
]

keywords = [
    "n-body",
    "n-body-simulation",
    "gravitational-dynamics",
    "graph-neural-network",
    "gnn",
    "physics-informed-machine-learning",
    "scientific-machine-learning",
    "astronomy",
    "astrophysics",
    "rebound",
    "pytorch-geometric"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]


# ============================================================
# Runtime dependencies
# ============================================================

dependencies = [
    "numpy>=2.0,<3.0",
    "scipy>=1.14,<2.0",
    "pandas>=2.2,<3.0",
    "pyyaml>=6.0,<7.0",

    # N-body simulation
    "rebound>=4.4,<5.0",

    # Machine learning
    "torch>=2.4,<3.0",
    "torch-geometric>=2.6,<3.0",

    # Visualization
    "matplotlib>=3.9,<4.0",
    "plotly>=5.24,<7.0",
    "streamlit>=1.40,<2.0",

    # Astronomy / scientific utilities
    "astropy>=6.1,<8.0",

    # HTTP/API access
    "requests>=2.32,<3.0",

    # Progress / CLI utilities
    "tqdm>=4.66,<5.0",
]


# ============================================================
# Optional development dependencies
# ============================================================

[project.optional-dependencies]

dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "pre-commit>=4.0,<5.0",
    "ipykernel>=6.29,<7.0",
    "jupyter>=1.1,<2.0",
]

docs = [
    "sphinx>=8.0,<9.0",
    "sphinx-rtd-theme>=3.0,<4.0",
]

all = [
    "Learned-nbody-surrogate[dev,docs]",
]


# ============================================================
# Project URLs
# ============================================================

[project.urls]
Repository = "https://github.com/yourfavCHEFP/Learned-N-Body-Surrogate.git"
Issues = "https://github.com/yourfavCHEFP/Learned-N-Body-Surrogate/issues"


# ============================================================
# Package discovery
# ============================================================

[tool.setuptools.packages.find]
where = ["src"]


# ============================================================
# Pytest
# ============================================================

[tool.pytest.ini_options]
minversion = "8.0"

testpaths = [
    "tests"
]

pythonpath = [
    "src"
]

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config"
]

markers = [
    "unit: fast isolated unit tests",
    "simulation: tests involving numerical simulations",
    "integration: integration tests",
    "slow: tests that may take significant time"
]


# ============================================================
# Ruff
# ============================================================

[tool.ruff]

target-version = "py311"

line-length = 100

src = [
    "src",
    "tests"
]

exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "data",
    "notebooks"
]


[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM"
]

ignore = [
    "E501"
]


[tool.ruff.lint.isort]

known-first-party = [
    "nbody_surrogate"
]


# ============================================================
# Mypy
# ============================================================

[tool.mypy]

python_version = "3.11"

mypy_path = [
    "src"
]

packages = [
    "nbody_surrogate"
]

ignore_missing_imports = true

warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

check_untyped_defs = true


# ============================================================
# Coverage
# ============================================================

[tool.coverage.run]

branch = true

source = [
    "src/nbody_surrogate"
]

omit = [
    "*/__init__.py"
]


[tool.coverage.report]

exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:"
]

show_missing = true
skip_covered = true


# ============================================================
# Pre-commit
# ============================================================

[tool.ruff.format]

quote-style = "double"

indent-style = "space"

line-ending = "auto"